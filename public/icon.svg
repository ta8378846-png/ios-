<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle rounded background for iOS / iPad -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border ring -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="230" r="140" fill="url(#cyanGlow)" opacity="0.12" />

  <!-- Chronicle Pad Stack (iPad Notes style icon) -->
  <g filter="url(#shadow)">
    <!-- Base Note Page -->
    <rect x="116" y="96" width="280" height="320" rx="24" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
    
    <!-- Top Note Header / Binder bar -->
    <path d="M 116 120 C 116 106.7 126.7 96 140 96 L 372 96 C 385.3 96 396 106.7 396 120 L 396 144 L 116 144 Z" fill="#0ea5e9" opacity="0.9"/>
    
    <!-- Chronicle Calendar Ring Holes -->
    <circle cx="176" cy="120" r="6" fill="#0f172a" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <circle cx="256" cy="120" r="6" fill="#0f172a" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <circle cx="336" cy="120" r="6" fill="#0f172a" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- Financial Chart trendline in background of note -->
    <path d="M 150 290 Q 200 240, 240 270 T 310 210 T 360 170" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Major Events Lines on Note -->
    <rect x="150" y="180" width="130" height="10" rx="5" fill="#e2e8f0" opacity="0.9"/>
    <rect x="150" y="206" width="90" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
    <rect x="150" y="326" width="180" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <rect x="150" y="348" width="140" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
    <rect x="150" y="370" width="160" height="8" rx="4" fill="#94a3b8" opacity="0.3"/>

    <!-- Golden Feather / Quill or Market Trend Flash Indicator -->
    <circle cx="360" cy="170" r="9" fill="#fbbf24" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Sparkle star for AI & intelligence -->
  <path d="M 370 70 Q 370 95, 395 95 Q 370 95, 370 120 Q 370 95, 345 95 Q 370 95, 370 70 Z" fill="url(#gold)"/>
</svg>
